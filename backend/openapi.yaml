openapi: 3.0.3
info:
  title: Hearth & Grain Bakery API
  version: 1.0.0
  description: API for the Hearth & Grain artisan bakery website and admin portal.
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: Health
  - name: Menu
  - name: Orders
  - name: Reservations
  - name: Interactions
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200':
          description: API is online
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/menu:
    get:
      tags: [Menu]
      summary: List menu items
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [all, bread, pastry, coffee]
        - name: search
          in: query
          schema: { type: string }
        - name: inStock
          in: query
          description: Set to true to return available items only.
          schema: { type: boolean }
      responses:
        '200':
          description: Menu items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
    post:
      tags: [Menu]
      summary: Create a menu item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemInput'
      responses:
        '201':
          description: Menu item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/menu/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Menu]
      summary: Update a menu item or stock status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemUpdate'
      responses:
        '200':
          description: Menu item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemResponse'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Menu]
      summary: Delete a menu item
      responses:
        '200': { $ref: '#/components/responses/SuccessMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Searches order ID, customer name, and phone.
          schema: { type: string }
      responses:
        '200':
          description: Orders sorted newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
    post:
      tags: [Orders]
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Order number or customer phone number.
        schema: { type: string }
    get:
      tags: [Orders]
      summary: Find an order for tracking
      responses:
        '200':
          description: Matching order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/orders/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Orders]
      summary: Update order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Received, In the Oven / Baking, Ready for Pickup, Completed, Cancelled]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      responses:
        '200':
          description: Reservations sorted newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationListResponse'
    post:
      tags: [Reservations]
      summary: Book a table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationInput'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/reservations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Reservations]
      summary: Update reservation status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, example: Confirmed }
      responses:
        '200':
          description: Reservation updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404': { $ref: '#/components/responses/NotFound' }
  /api/schedule:
    get:
      tags: [Interactions]
      summary: Get weekly bake schedule
      responses:
        '200':
          description: Weekly schedule and today's special
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  currentDay: { type: integer, minimum: 0, maximum: 6 }
                  todaySpecial: { $ref: '#/components/schemas/ScheduleItem' }
                  schedule:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduleItem' }
  /api/reviews:
    get:
      tags: [Interactions]
      summary: List customer reviews
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
    post:
      tags: [Interactions]
      summary: Submit a customer review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/contact:
    post:
      tags: [Interactions]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201': { $ref: '#/components/responses/SuccessMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/newsletter:
    post:
      tags: [Interactions]
      summary: Subscribe to the newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterInput'
      responses:
        '201': { $ref: '#/components/responses/SuccessMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/stats:
    get:
      tags: [Interactions]
      summary: Get admin dashboard statistics
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid or incomplete request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SuccessMessage:
      description: Operation completed
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              message: { type: string }
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: online }
        bakery: { type: string }
        timestamp: { type: string, format: date-time }
    MenuItem:
      type: object
      required: [id, name, category, price, inStock]
      properties:
        id: { type: string, example: br-1 }
        name: { type: string }
        category: { type: string, enum: [bread, pastry, coffee] }
        price: { type: number, minimum: 0 }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        inStock: { type: boolean }
        image: { type: string }
    MenuItemInput:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string }
        category: { type: string }
        price: { type: number, minimum: 0 }
        description: { type: string }
        tags:
          oneOf:
            - type: array
              items: { type: string }
            - type: string
        image: { type: string }
    MenuItemUpdate:
      allOf:
        - $ref: '#/components/schemas/MenuItemInput'
        - type: object
          properties:
            inStock: { type: boolean }
    MenuItemResponse:
      type: object
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/MenuItem' }
    MenuListResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/MenuItem' }
    OrderItem:
      type: object
      required: [id, name, price, quantity]
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [customerName, customerPhone, items]
      properties:
        customerName: { type: string }
        customerPhone: { type: string }
        customerEmail: { type: string, format: email }
        fulfillmentType: { type: string, enum: [pickup, delivery] }
        pickupTime: { type: string }
        deliveryAddress: { type: string }
        paymentMethod: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItem' }
        notes: { type: string }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            status: { type: string }
            subtotal: { type: number }
            packagingFee: { type: number }
            total: { type: number }
    OrderResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/Order' }
    OrderListResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
    ReservationInput:
      type: object
      required: [name, phone, date, time]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        date: { type: string, format: date }
        time: { type: string }
        guests: { type: integer, minimum: 1, default: 2 }
        occasion: { type: string }
        specialRequests: { type: string }
    Reservation:
      allOf:
        - $ref: '#/components/schemas/ReservationInput'
        - type: object
          properties:
            id: { type: string }
            status: { type: string }
            createdAt: { type: string, format: date-time }
    ReservationResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/Reservation' }
    ReservationListResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/Reservation' }
    ScheduleItem:
      type: object
      properties:
        index: { type: integer }
        dayName: { type: string }
        name: { type: string }
        bake: { type: string }
        time: { type: string }
        description: { type: string }
    ReviewInput:
      type: object
      required: [author, rating, comment]
      properties:
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        comment: { type: string }
    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewInput'
        - type: object
          properties:
            id: { type: string }
            date: { type: string }
            verified: { type: boolean }
    ReviewResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/Review' }
    ReviewListResponse:
      type: object
      properties:
        success: { type: boolean }
        count: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/Review' }
    ContactInput:
      type: object
      required: [name, message]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        message: { type: string }
    NewsletterInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    StatsResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            totalRevenue: { type: number }
            totalOrders: { type: integer }
            activeOrders: { type: integer }
            readyOrders: { type: integer }
            totalReservations: { type: integer }
            menuItemCount: { type: integer }
            inStockCount: { type: integer }
            subscribersCount: { type: integer }
